[package]
name = "apex-exec"
version = "0.1.0"
edition = "2021"
description = "Transaction construction: the deterministic execution commitment, executor calldata, signing."

[dependencies]
apex-types = { path = "../apex-types" }
apex-search = { path = "../apex-search" }
alloy-primitives = { version = "0.8", features = ["serde"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
