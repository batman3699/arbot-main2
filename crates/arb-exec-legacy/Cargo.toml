[package]
name = "arb-exec"
version = "0.2.0"
edition = "2021"
default-run = "arb-exec"

# All SIX targets are declared explicitly. Four of them -- ingest,
# cycle_index_stats, ws_probe and encode_plan_v2 -- were previously implicit
# `src/bin/` targets. Cargo builds those, but `cargo test --lib` does not reach
# them, which is how the sizing and hot_pools tests came to run only under
# `--bins`. Declaring them keeps `--all-targets` honest. (PLAN.md B-11; note the
# audit said three, the fifth binary encode_plan_v2 was missed.)
[[bin]]
name = "arb-exec"
path = "src/main.rs"

[[bin]]
name = "cl_parity"
path = "src/bin/cl_parity.rs"

[[bin]]
name = "ingest"
path = "src/bin/ingest.rs"

[[bin]]
name = "cycle_index_stats"
path = "src/bin/cycle_index_stats.rs"

[[bin]]
name = "ws_probe"
path = "src/bin/ws_probe.rs"

[[bin]]
name = "encode_plan_v2"
path = "src/bin/encode_plan_v2.rs"

[dependencies]
apex-math = { path = "../apex-math" }
apex-types = { path = "../apex-types" }
apex-sim = { path = "../apex-sim" }
apex-venues = { path = "../apex-venues" }
anyhow = "1"
ethers = { version = "2.0.14", features = ["abigen", "ws", "rustls"] }
tokio = { version = "1", features = ["full", "test-util"] }
serde = { version = "1", features = ["derive"] }
json5 = "0.4"
dotenvy = "0.15"
once_cell = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
hex = "0.4"
hex-literal = "0.4"
rayon = "1"
rand = "0.8"
arc-swap = "1"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde_json = "1.0"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
prometheus = "0.13"
sha2 = "0.10"
semver = { version = "1.0", default-features = false, features = ["std"] }
csv = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
rust_decimal = { version = "1", default-features = false, features = ["maths", "std"] }
lru = "0.12"
serde_yaml = "0.9"
async-trait = "0.1"
dashmap = "6"
# revm 20.x stack: in-process EVM fork simulation (sim_revm.rs)
revm = { version = "20", features = ["std"] }
rlp = "0.5"
# Exhaustive interleaving model for the dirty-set protocol (spec 8 I1).
# Gated behind a FEATURE, not RUSTFLAGS="--cfg loom": a global cfg activates
# cfg(loom) paths inside concurrent-queue, which cannot build without loom as
# its own dependency.
loom = { version = "0.7", optional = true }

[features]
loom-model = ["dep:loom"]

[dev-dependencies]
tempfile = "3"
httpmock = "0.7"
