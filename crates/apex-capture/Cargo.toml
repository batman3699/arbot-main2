[package]
name = "apex-capture"
version = "0.1.0"
edition = "2021"
description = "Capture Assurance Controller: ticket lifecycle, journal, reservation, signing, dispatch."

[dependencies]
apex-types = { path = "../apex-types" }
alloy-primitives = { version = "0.8", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"
tempfile = "3"
