[package]
name = "apex-capture"
version = "0.1.0"
edition = "2021"
description = "Capture Assurance Controller: ticket lifecycle, journal, reservation, signing, dispatch."

[dependencies]
apex-types = { path = "../apex-types" }
alloy-primitives = { version = "0.8", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"
tempfile = "3"

# loom explores every interleaving of `tests/nonce_loom.rs`, which is only
# possible if the primitives it is exploring are its own -- so `src/sync.rs`
# swaps them in under `--cfg loom`. A regular dependency rather than a dev one:
# `src/sync.rs` is in the LIB, and a lib cannot see dev-dependencies. Not a
# default-cfg test either -- a loom run is
# minutes, not milliseconds, and it gates in CI rather than on every save.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
