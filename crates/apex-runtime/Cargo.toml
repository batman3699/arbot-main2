[package]
name = "apex-runtime"
version = "0.1.0"
edition = "2021"
description = "The §46 control plane: event bus, resource classes, capture-protocol assembly, supervision, graceful shutdown."

# The crate is a lib FIRST and a bin second, and that order is the whole point
# of the task. `src/main.rs` alone cannot be driven by an integration test --
# `tests/` can only import a lib -- and "untestable as components" is the exact
# defect recorded against the 16,659-line `main.rs` this replaces. A binary that
# is a thin `main` over a testable lib is the shape that makes the end-to-end
# test possible at all.
[lib]
name = "apex_runtime"
path = "src/lib.rs"

[[bin]]
name = "apex"
path = "src/main.rs"

[dependencies]
apex-types = { path = "../apex-types" }
apex-capture = { path = "../apex-capture" }
apex-chain = { path = "../apex-chain" }
apex-config = { path = "../apex-config" }
apex-obs = { path = "../apex-obs" }
apex-econ = { path = "../apex-econ" }
apex-math = { path = "../apex-math" }
# apex-econ and apex-math speak ethers U256; apex_types::compat is the bridge.
ethers-core = "2.0.14"
# `LocalWallet`, which §18.4 names for Phase 6's in-process keys. Already in the
# lockfile through the legacy crate, so this adds an edge and no new code.
ethers-signers = "2.0.14"
apex-risk = { path = "../apex-risk" }
apex-sim = { path = "../apex-sim" }
apex-search = { path = "../apex-search" }
apex-venues = { path = "../apex-venues" }
apex-state = { path = "../apex-state" }
# `ExecutorCall`: the one call a ticket makes, built once and handed to both the
# simulator and the signer.
apex-exec = { path = "../apex-exec" }
alloy-primitives = { version = "0.8", features = ["serde"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
serde_json = "1"
apex-math = { path = "../apex-math" }
ethers-core = "2.0.14"
