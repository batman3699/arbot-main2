# `apex canary` on Base (Task 8.5 R28): the reactive lane SENDS, one ticket at
# a time, under the canary's limits at the end of this file. The armed lane
# stays in shadow. See ops/host/README.md §10 and
# docs/superpowers/specs/2026-10-15-live-canary-design.md.
#
# Everything but the journal, the signer's reserve, the cost-confidence cap and
# the canary section is the shadow's (tests/shadow_parts.rs holds them equal).
#
# No secret is in this file. Placeholders for APEX_SECRET_ variables resolve
# from the environment at boot, and an unset one refuses to start; the signer's
# key is named by its variable and read once, never parsed from YAML.
# `scripts/shadow.sh` maps the operator's .env onto these names.
#
# Placeholders are resolved before the YAML is parsed, comments included: a
# dollar-brace in a comment is a placeholder too.
#
# Unknown fields are refused: a misspelt one would otherwise take a default.

chain_id: 8453

rpc:
  # BlockPI's keyed endpoint: `eth_simulateV1`, `pendingLogs` and
  # `newFlashblocks` were each probed on it (PLAN.md, Task 8.5 R1, R5, R7).
  http:
    - https://base.blockpi.network/v1/rpc/${APEX_SECRET_BLOCKPI_KEY}
  ws: wss://base.blockpi.network/v1/ws/${APEX_SECRET_BLOCKPI_KEY}

# The census's inventory (outside git). The run loads the pools that can form
# a WETH cycle: pairs with WETH and at least two pools at <= 500 ppm and
# >= $100k depth.
inventory: data/base

# The canary's own journal: recovery reconciles it against the chain and
# canary.jsonl. Must be named as a canary's, never a shadow's.
journal: var/apex/canary.journal
report: var/apex/shadow.report.jsonl
misses: var/apex/shadow.misses.jsonl
# R25: the race ledger (one line per handled proposal) and Base's public
# flashblock stream with its ledger. Measurement only; nothing priced reads
# them. Each is a file per UTC day: race-YYYY-MM-DD.jsonl.
race: var/apex/race.jsonl
flashblocks:
  stream: wss://mainnet.flashblocks.base.org/ws
  ledger: var/apex/flashblocks.jsonl
# R26: armed backruns. armed-shadow arms each top route's gap as a validity
# transaction would wait in Base's builder: built and recorded, never sent.
# `apex armed-eval` (a timer on the host) judges every arm against the chain.
# R36: the census's targets (apex-targets.timer) choose the routes; armed-live
# also sends, from the senders in live.keys_file (ops/host/ARMED.md). Every
# cap is here, read by the engine and the live worker alike. Armed-live's files
# are in var/armed: the unit can write there, and a new revision's archive of
# var/apex leaves them in place.
armed:
  mode: shadow
  ledger: var/apex/armed.jsonl
  verdicts: var/apex/armed-verdicts.jsonl
  targets: var/armed/targets.json
  targets_max_age_s: 172800
  max_arms: 16
  rungs: 6
  window_s: 10
  block_time_ms: 2000            # 200 on the Denim day (ops/host/ARMED.md)
  margin_wei: 0
  band_cap_bps: 5
  liquidity_floor_bps: 9800
  max_priority_wei_per_gas: 20000000000
  daily_loss_budget_wei: 10000000000000000   # 0.01 ETH: realized loss plus everything pending
  max_size_wei: 5000000000000000000          # 5 WETH
  l1_fee_bound_wei: 50000000000000           # 0.00005 ETH
  sender_reserve_wei: 200000000000000        # 0.0002 ETH
  moves: var/armed/moves.json                # the ranking's move statistics, kept across restarts
  # R37: LeanExecutor2 (ops/host/ARMED.md §3). Until the owner deploys it the
  # address is a placeholder with no code, and the evaluator simulates every
  # fire against runtime_code put there (`forge inspect LeanExecutor2
  # deployedBytecode`), whose keccak is code_hash: the deploy dry run's
  # 2026-10-29 hash. Live refuses runtime_code. Set, every arm is built for it.
  executor2:
    address: "0x00000000000000000000000000000000000e2e02"
    code_hash: "0xb67e7dd210e440dae114d36ca40d13d65fd2150a26a71dc53c86a3af83b39c7e"
    runtime_code: var/armed/LeanExecutor2.runtime.hex
  max_size_usdc: 12000000000                 # 12,000 USDC, about max_size_wei's 5 WETH
  live:
    keys_file: var/armed/armed.keys
    sequencer: https://mainnet-sequencer.base.org
    ledger: var/armed/armed-live.jsonl
    kill_file: var/armed/armed.disable

executor:
  # R29: the lean executor, deployed 2026-10-19 by the owner with
  # script/DeployLeanExecutor.s.sol (ops/host/README.md §11): owned by the owner
  # EOA itself, no router, not upgradeable. The code hash is keccak256 of its
  # runtime code, read back from the chain; other code there reads as version 0,
  # and last-mile check 2 refuses every ticket. The Phase 5 clone
  # 0x8940...F93B stays deployed, its trader revoked (README §11d).
  address: "0xd25BD9A60113728a2ECb9FdC9392Cde8D906f2c5"
  code_hash: "0xb513cb0f22d3bf302747f47a6dfb118b5d5f824bd1794925d481a28a8a46336a"
  # The plan version the call builder encodes (LEAN_PLAN_VERSION).
  plan_version: 3

signer:
  lane: 1
  key_env: APEX_SECRET_TRADER_KEY
  # The trader the deploy authorized (`setExecutor`, read back on chain). The
  # key must sign as it, or the run refuses to start. Not .env's PRIVATE_KEY:
  # that signs as the router's owner, and scripts/shadow.sh never reads it.
  address: "0xCB436Ba3acb945b3fc8EE6345857262584356595"
  # 0.0001 ETH kept back: the trader starts with 0.0014 (R28). Last-mile check 7
  # requires it, plus the most a trade can cost, before every send.
  gas_reserve_wei: 100000000000000

policy:
  # 0.1 gwei: Base's base fee has run ~0.002-0.01 gwei; a ticket signs at
  # twice the observed fee, capped here, and is refused above it.
  fee_ceiling_wei: 100000000
  # Any positive net. The on-chain floor question (expected net against the
  # executor's gross check) is open before any canary (PLAN.md, R6 finding).
  min_profit_wei: 1
  slippage_bps_per_hop: 30
  # A full reload every 30 minutes refreshes the evidence; an hour's bound
  # allows one to fail, and a failed one is asked for again at the next head.
  # Every 30 minutes, not 15, since R28.1: Mint and Burn are applied in place,
  # and each full reload is ~12.5 MB of BlockPI traffic.
  max_evidence_age_blocks: 1800
  # Three blocks: a view the head task has stopped refreshing is not a reading.
  max_view_age_ms: 6000
  full_reload_every_s: 1800
  report_every_s: 300
  # The L1 fee oracle moves with L1 blocks; once a minute.
  l1_every_blocks: 30
  # The risk gate's cost-confidence cap: the gas estimate's p50-to-p99 width
  # in wei, as a share of the expected profit. The default (1,000 bps, a tenth)
  # refused the first trade ever to pass Tier 2 in the block being built
  # (ticket 46, 2026-10-06: half a cent expected, a 1,629 bps width, still
  # profitable at p99 gas). Operator decision: 10,000 bps for the shadow only,
  # refusing just a trade its worst-case gas would leave without profit. A live
  # run keeps the default (operator, 2026-10-06): this one does.
  max_cost_confidence_bps: 1000
  # R31 (operator, 2026-10-21: maximise expected profit): each trade's priority
  # fee is the bid b per gas earning the most over bidding nothing,
  # P_same x F(b) x net - b x gas: F the share of rivals' bids below b, P_same
  # the share of gaps contested in our own flashblock, measured on 618 gaps we
  # priced (scripts/data/rival_bids.py). Fitted on the earlier 432 and scored
  # on the later 186, it kept 0.0138 ETH against R28's flat 20%'s 0.0035,
  # level with bidding nothing, and won 110 gaps against 102.
  rival_bids: ops/rival-bids.base.json

# How a settlement fails, and what failing costs: what the chain does not say.
# The costliest revert on the R6/R7 fork (hop 2's minimum) used 411,945 gas.
# The failure rate is not measured: it is one of the things this run measures.
# What a success uses is not here: it is each route's own, at its size, from
# the ticks it crosses (live::gas::MEASURED, R12), and every ticket's gas limit
# is built from that.
costs:
  gas_on_failure: 411945
  failure_ppm: 50000

# R5: `newFlashblocks` is ~750 KiB/s, so it is sampled, never held open.
# Hourly since R27.3: BlockPI charges by the byte, and 20 s every 15 minutes
# was 1.4 GB a day, a sixth of everything the host moves, for a figure (the
# largest gas window seen) that changes little from hour to hour.
capacity:
  boot_sample_s: 60
  sample_every_s: 3600
  sample_for_s: 20

# Which pools the run may price (R20, operator decision 2026-10-06). The
# census's 500 ppm left out Base's deepest WETH/USDC and WETH/cbBTC pools,
# Uniswap's 0.3% ($60M, $6.3M) and Slipstream's spacing-100 ($8.8M at ~570
# ppm, $17M at 2,500), where the large swaps behind every real gap land.
# Pricing is exact at any fee; a 30 bps pool simply pays less often.
# The depth floor is $50k on the WETH side (operator, 2026-10-20, R30): on the
# inventories refreshed from the factories at block 52,835,268 it admits 52
# pools and 212 cycles, holding $8.5k a week of the R23 census's two-hop WETH
# arbitrage against $7.5k at $100k; each pool adds at most ~64 MB a day of
# BlockPI traffic.
universe:
  max_fee_ppm: 3000
  min_depth_usd: 50000
  # R37: the reviewed Uniswap v4 hooks; a hooked v4 pool off this list is
  # refused (ops/host/ARMED.md §3).
  v4_hooks: ops/v4-hooks.base.json

# R28: the canary (docs/superpowers/specs/2026-10-15-live-canary-design.md §8).
canary:
  ledger: var/apex/canary.jsonl
  # `touch` it to stop new sends; remove it to resume. Not a halt.
  stop_file: var/apex/canary.stop
  # The executor must pay profit and fees here, or the canary refuses to start
  # (the owner's recipient change, ops/host/README.md §10).
  profit_recipient: "0x69D54e5fC0b9325D7250f0D0A11690327A3dd8A3"
  # R32.1 (operator, 2026-10-21): sends go to Base's sequencer first, and to
  # BlockPI (rpc_http[0]) whenever the sequencer has not taken them.
  # `apex send-probe` measured inclusion 70-254 ms after the send through the
  # sequencer (median 145) and 624-1,679 ms through BlockPI's protected
  # endpoint (median 877), which every one of the canary's 15 sends to date
  # went through, each 3-7 flashblocks late. Base runs no public mempool, and
  # a trade beaten to its gap reverts on its hop minimums.
  send_url: https://mainnet-sequencer.base.org
  # 0.001 ETH lost on losing trades; wins do not offset it. A full-cost revert
  # is ~0.0000024 ETH, so ~400 of them.
  loss_cap_wei: 1000000000000000
  max_consecutive_reverts: 5
  max_consecutive_refusals: 2
  max_landed: 100
  receipt_poll_ms: 250
  settle_timeout_ms: 10000
