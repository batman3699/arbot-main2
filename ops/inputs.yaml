      linear_per_gas_bps: 1
  - chain_name: optimism
    min_net_profit_usd: 20
    max_gas_units_per_tx: 500000
    max_fee_per_gas_cap: 200000000000
    max_slippage_bps: 60
    max_price_impact_bps: 80
    must_simulate_before_send: true
    revert_penalty_model:
      kind: linear
      linear_base_bps: 10
      linear_per_gas_bps: 1
  - chain_name: base
  # Base L2 gas ~0.005 gwei base + ~0.005–0.05 gwei tip → ~$0.01–0.05 gas per
  # 550k-gas arb tx at $1,665/ETH. Floor targets ~$2 net after gas/flash on
  # Balancer 0%-fee paths; Aave 5 bps paths need larger gross spreads.
    min_net_profit_usd: 2
    min_net_profit_native: 0.0008
  # A multi-tick CL hop costs far more than a constant-product one: each tick
  # crossing is an SLOAD plus bitmap work, so a 2-hop cycle through a busy
  # Uniswap V3 pool measured ~3-4M gas at our sizes. The old 500k cap was below
  # the floor of a *working* trade, so every candidate died out-of-gas inside
  # pool.swap(). That OOG returns empty revert data, which _executeSteps then
  # collapses into InvalidGenericAction() -- which is why the failure looked
  # like a plan defect for so long instead of a budget. Verified by replaying
  # captured calldata at block 50222943: 450k/3M -> 0xf19db938, 4M+ -> the real
  # router error. Gas is cheap on Base (~4M ~= $0.07), so the cap should bound
  # absurdity, not ordinary CL execution.
    max_gas_units_per_tx: 4000000
    max_fee_per_gas_cap: 5000000000000
    max_slippage_bps: 50
    max_price_impact_bps: 70
    must_simulate_before_send: true
    revert_penalty_model:
      kind: linear
      linear_base_bps: 10
      linear_per_gas_bps: 1
  - chain_name: linea
    min_net_profit_usd: 15
    max_gas_units_per_tx: 450000
    max_fee_per_gas_cap: 200000000000
    max_slippage_bps: 70
    max_price_impact_bps: 90
    must_simulate_before_send: true
    revert_penalty_model:
      kind: exponential
      exponential_base_bps: 10
      exponential_factor: 2
  - chain_name: abstract
    min_net_profit_usd: 10
    max_gas_units_per_tx: 400000
    max_fee_per_gas_cap: 200000000000
    max_slippage_bps: 80
    max_price_impact_bps: 100
    must_simulate_before_send: true
    revert_penalty_model:
      kind: flat
      flat_bps: 30
  - chain_name: ink
    min_net_profit_usd: 10
    max_gas_units_per_tx: 400000
    max_fee_per_gas_cap: 200000000000
    max_slippage_bps: 80
    max_price_impact_bps: 100
    must_simulate_before_send: true
    revert_penalty_model:
      kind: flat
      flat_bps: 30
