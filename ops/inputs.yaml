      - '0x2Ae3F1Ec7F1F5012CFEab0185bfc7aa3cf0DEc22' # cbETH
      - '0x60a3e35cc302bfa44cb288bc5a4f316fdb1adb42' # EURC
      - '0x236aa50979d5f3de3bd1eeb40e81137f22ab794b' # tBTC
      - '0xc1cba3fcea344f92d9239c08c0568f6f2f0ee452' # wstETH
