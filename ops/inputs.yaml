# Aerodrome — Base's dominant DEX (Solidly/Velodrome-style vAMM + sAMM).
  # Pools are supplied via BASE_SOLIDLY_V2_POOLS (config/base_aerodrome_pools.json);
  # the solidly edge path quotes stable/volatile curves with real per-pool fees.
  - name: aerodrome
    kind: solidly_v2_like
    factory: '0x420DD381b31aEf6683db6B902084cB0FFECe40Da'
    router: '0xcF77a3Ba9A5CA399B7c97c74d54e5b1Beb874E43'
    fee_bps: 30
    pool_init_code_hash: '0x6f178972b07752b522a4da1c5b71af6524e8b0bd6027ccb29e5312b0e5bcdc3c'
  # Aerodrome Slipstream — concentrated-liquidity pools (tickSpacing, not UniV3 fee tiers).
  # Pool inventory: data/base/aerodrome_slipstream/pools.jsonl (build_slipstream_pools.py).
  # kind MUST be slipstream_like, not univ3_like. Under univ3_like these pools
  # become VenueEdge::UniV3 -> StepData::Uniswap -> op EXECUTOR_OP_UNIV3, which
  # carries NO target address, so the executor uses its built-in Uniswap router
  # (0x2626664c...) instead of Aerodrome's. Every Slipstream cycle would revert.
  # slipstream_like routes them through StepData::Generic targeting the router
  # below. Verified 2026-09-03: 0xBE6D8f0d has 9,908 bytes of code and contains
  # the exactInput selector 0xc04b8d59 that plan.rs encodes.
  - name: aerodrome_slipstream
    kind: slipstream_like
    factory: '0x5e7BB104d84c7CB9B682AaC2F3d509f5F406809A'
    router: '0xBE6D8f0d05cC4be24d5167a3eF062215bE6D18a5'
    quoter: '0x254cF9E1E6e233aa1AC962CB9B05b2cfeAaE15b0'
    fee_tiers:
     - 1
     - 50
     - 100
     - 200
     - 500
     - 3000
  # DISABLED 2026-08-28 — venue is redundant AND its addresses are dead.
  #   router 0xBE6D8f0d05cC4be24d5167a3eF06994aECdE6EeA -> NO CODE on Base
  #   quoter 0x254cF9E1E6e23345657528ECF97B14a5b9Bf4A14 -> NO CODE on Base
  # Both are FABRICATED: they share a 28- and 14-char prefix with the real
  # slipstream router/quoter, i.e. generated by copying a prefix rather than
  # read from chain. Every edge from this venue was unquotable.
  # Its 177 pools are ALSO an exact duplicate of aerodrome_slipstream_v3
  # (177/177 overlap), 127 of which duplicate aerodrome_slipstream, so
  # nothing is lost by removing it.
#    kind: univ3_like
#    factory: '0xaDe65c38CD4849aDBA595a4323a8C7DdfE89716a'
#    router: '0xBE6D8f0d05cC4be24d5167a3eF06994aECdE6EeA'
#    quoter: '0x254cF9E1E6e23345657528ECF97B14a5b9Bf4A14'
#    fee_tiers:
#    - 1
#    - 50
#    - 100
#    - 200
#    - 500
#    - 3000
  # DISABLED 2026-09-03 — a SECOND Slipstream deployment the architecture
  # cannot serve. Its addresses are real (factory 5,235 bytes, router 9,908 with
  # exactInput, quoter 8,225 — all bytecode-checked, unlike the fabricated pair
  # disabled above) and its 63 pools do NOT overlap aerodrome_slipstream's 84
  # (measured: 0 shared). But resolve_slipstream_venue() takes the FIRST venue
  # with kind slipstream_like and SlipstreamEdgeContext holds ONE router, so a
  # second Slipstream venue would be routed through the first one's router.
  #
  # Left as univ3_like it was equally broken and silently so: op
  # EXECUTOR_OP_UNIV3 sends it to the executor's Uniswap router.
  #
  # RE-ENABLED 2026-09-03. The fast path now carries each pool's router in
  # FastVenue::RoutedCl, so this venue's 63 pools build calldata against
  # 0x698Cb2b6 rather than inheriting another venue's router. Kept as
  # univ3_like, NOT slipstream_like: resolve_slipstream_venue() still returns a
  # single venue, so a second slipstream_like entry would take the first one's
  # router in the SCAN path. Under univ3_like the fast path routes it correctly
  # and the scan treats it as it always has.
  - name: aerodrome_slipstream_v3
    kind: univ3_like
    factory: '0xf8f2eB4940CFE7d13603DDDD87f123820Fc061Ef'
    router: '0x698Cb2b6dd822994581fEa6eA4Fc755d1363A92F'
    quoter: '0xCd2A7D98e82D6107eac1828ce8DeAA6acB65b555'
    fee_tiers:
    - 1
    - 50
    - 100
    - 200
    - 2000
   # PancakeSwap V3 — UniV3-compatible CL pools (separate factory/quoter from Base UniV3).
  # Pool inventory: data/base/pancakeswap_v3/pools.jsonl (build_pancakeswap_pools.py).
  - name: pancakeswap_v3
    kind: univ3_like
    factory: '0x0BFbCF9fa4f9C56B0F40a671Ad40E0805A091865'
