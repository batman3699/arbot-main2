      - '0xc1cba3fcea344f92d9239c08c0568f6f2f0ee452' # wstETH
      - '0x04c0599ae5a44757c0af6f9ec3b93da8976c150a' # weETH
  - name: balancer_v2
    kind: balancer_vault_like
    vault: '0xBA12222222228d8Ba445958a75a0704d566BF2C8'
    fee_bps: 0
    max_loan_assets:
