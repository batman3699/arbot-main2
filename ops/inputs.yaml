  - '0xc1CBa3fCea344f92D9239c08C0568f6F2F0ee452'
  min_pool_liquidity_usd: 100000
  min_pool_liquidity_tokens: 1
  max_hot_pools_per_chain_per_venue: 1500
  max_cold_pools_stored: 2500
  # Widened from 1000. With honest (quoter) pricing only ~10 candidate cycles
  # formed per 7 minutes, which is too small a sample to find a live arb. More
  # edges costs RPC, offset by the concurrency increase.
  max_edges_hot: 800
  # Hard cap on cycles kept per START token per scan (cap_cycles_per_start).
  # Unlike max_edges_hot / parallel_edges_per_pair — both of which proved inert —
  # this one truncates the candidate set directly. Raised 6 -> 24 to test whether
  # the ~10-12 candidates/7min plateau is a cap or a genuine shortage.
  topk_per_token: 7
  max_hops: 6
  cycle_candidate_cap_per_block: 500
  event_sampling_rate: 0.85
  event_sampling_block_window: 120
  hot_pool_refresh_secs: 300
  time_budget_ms:
    search: 550
    quoting: 320
    # Measured post-allowlist (executor now runs the full plan instead of
    # reverting early at NotExecutor): p50 670ms, p90 881ms, max 924ms.
    # 1200 clears the observed max with headroom and still fits a 2s block.
    simulation: 1200
