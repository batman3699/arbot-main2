[profile.default]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
src = "contracts"
script = "script"
test = "test"
out = "out"
libs = ["lib"]
via_ir = true

# Remappings if needed later
remappings = [
    "forge-std/=lib/forge-std/src/"
]


# Read-only, and scoped to one directory. `PlanCommitmentFixture.t.sol` asserts
# that `crates/apex-exec/tests/fixtures/plan_commitments.json` still describes
# this contract; `apex-exec` asserts its Rust encoder reproduces the same file.
# Neither side may write it -- a test that regenerated the fixture would make the
# two agree by construction, which is the one thing a differential must not do.
# R36: the owner scripts read ops/armed-senders.json (addresses only).
fs_permissions = [{ access = "read", path = "./crates/apex-exec/tests/fixtures" }, { access = "read", path = "./ops" }]

# Fork tests read Base over the network (Task 8.5 R29): never in the everyday
# run or CI, only under `FOUNDRY_PROFILE=fork`, each top-level call its own
# transaction so its gas is a transaction's.
no_match_path = "test/fork/*"

# Invariant runs are bounded for the everyday loop; `forge test --profile deep`
# is what Task 5.6 Step 2's 100k-run bar uses. A suite nobody can run in a
# minute is a suite that gets skipped, and a suite that only ever runs shallow
# is one that proves less than its name suggests -- so both exist.
[profile.default.invariant]
runs = 64
depth = 32
fail_on_revert = false

[profile.deep]
src = "contracts"
test = "test"
out = "out"
libs = ["lib"]

[profile.deep.invariant]
runs = 1024
depth = 128
fail_on_revert = false

[profile.deep.fuzz]
runs = 100000

# Named endpoints, so a fork or a broadcast never needs the provider key on the
# command line, where the process table and shell history would keep it
# (INV-46). forge loads `.env`, and `${BLOCKPI_KEY}` is interpolated from it.
#
# **`forge script` does not fork from `ETH_RPC_URL` alone.** A dry run that
# relied on it simulated against an empty local chain at block 1, where every
# integration address has no code -- found by a probe, 2026-09-30, before its
# result was reported as a Base check. Use `--rpc-url base`.
[rpc_endpoints]
base = "https://base.blockpi.network/v1/rpc/${BLOCKPI_KEY}"

[profile.fork]
match_path = "test/fork/*"
no_match_path = "test/__none__/*"
isolate = true
